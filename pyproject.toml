[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-keystream-bridge"
version = "0.1.0"
description = "Firebase-to-serial keyboard bridge for Raspberry Pi and Teensy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "firebase-admin>=6.5.0,<7.0.0",
  "pyserial>=3.5,<4.0",
]

[project.scripts]
pi-keybridge = "pi_keystream_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

